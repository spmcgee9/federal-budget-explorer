name: Update data and deploy

on:
  # Redeploy whenever you push changes (code, descriptions, new DoD exhibits...)
  push:
    branches: [main]
  # Refresh Treasury and USAspending data on the 20th of each month.
  # Treasury's final statement comes out mid-October; USAspending posts each month about a month later.
  schedule:
    - cron: "17 11 20 * *"
  # Run by hand from the Actions tab (e.g. after adding new budget exhibits or a new state workbook)
  workflow_dispatch:
    inputs:
      fy:
        description: "Fiscal year to rebuild (leave blank for the latest completed year)"
        required: false
      states_ffy:
        description: "State data: federal fiscal year of a new Comptroller workbook (optional)"
        required: false
      states_url:
        description: "State data: link to the Comptroller's Excel workbook (optional)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data
        env:
          FY: ${{ inputs.fy }}
          STATES_FFY: ${{ inputs.states_ffy }}
          STATES_URL: ${{ inputs.states_url }}
        run: |
          args=()
          [ -n "$FY" ] && args+=(--fy "$FY")
          if [ -n "$STATES_FFY" ] && [ -n "$STATES_URL" ]; then
            args+=(--states-ffy "$STATES_FFY" --states-url "$STATES_URL")
          fi
          python pipeline/update.py "${args[@]}"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data raw
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    # runs after a successful update, and on plain pushes (when update is skipped)
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
